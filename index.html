<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JASA AQIQAH DEPOK #2</title>
<link rel="icon" type="image/png" href="logo-juragan-kambing.png">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #eef2f5 0%, #dfe9f3 100%);
    margin:0; padding:20px; color:#2c3e50;
  }

  .headerBar {
    display:flex; align-items:center; justify-content:center;
    gap:12px; margin-bottom:6px; flex-wrap:wrap;
  }
  .logoHeader {
    width:56px; height:56px; border-radius:50%; object-fit:cover;
    box-shadow:0 3px 10px rgba(0,0,0,.25); border:2px solid #fff;
  }

  h1 {
    text-align:center;
    background: linear-gradient(90deg, #2c3e50, #4b6584);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin:0; font-size:28px; font-weight:700;
  }

  #jamRealTime { text-align:center; font-size:15px; color:#34495e; margin-bottom:4px; font-weight:600; }
  #infoUpdate { text-align:center; color:#95a5a6; margin-bottom:24px; font-size:13px; font-style: italic; }

  .kartu { display:flex; flex-wrap:wrap; gap:16px; justify-content:center; margin-bottom:24px; }

  .kotak {
    background:#fff; border-radius:14px; padding:20px 24px;
    box-shadow:0 4px 12px rgba(0,0,0,.08); text-align:center;
    min-width:150px; flex:1 1 150px;
    transition: transform .2s ease, box-shadow .2s ease;
    border-top: 4px solid #3498db;
  }
  .kotak:hover { transform: translateY(-4px); box-shadow:0 8px 18px rgba(0,0,0,.12); }
  .kotak h2 { margin:0; font-size:30px; color:#2c3e50; font-weight:700; }
  .kotak p { margin:6px 0 0; color:#7f8c8d; font-size:13px; letter-spacing:.3px; }

  .kotak:nth-child(1) { border-top-color:#3498db; }
  .kotak:nth-child(2) { border-top-color:#27ae60; }
  .kotak:nth-child(3) { border-top-color:#f39c12; }
  .kotak:nth-child(4) { border-top-color:#e74c3c; }
  .kotak:nth-child(5) { border-top-color:#9b59b6; }

  .kotakJadwal {
    background: linear-gradient(135deg, #2c3e50, #4b6584); color:#fff;
    border-radius:14px; padding:20px 24px;
    box-shadow:0 4px 12px rgba(0,0,0,.15); text-align:center; margin-bottom:24px;
  }
  .kotakJadwal h2 { margin:0; font-size:19px; font-weight:600; }
  .kotakJadwal p { margin:4px 0 0; color:#bdc3c7; font-size:13px; }
  #countdown { font-size:24px; font-weight:bold; color:#f1c40f; margin-top:8px; letter-spacing:1px; }

  table {
    width:100%; border-collapse:collapse; background:#fff;
    border-radius:14px; overflow:hidden; box-shadow:0 4px 12px rgba(0,0,0,.08);
  }
  th, td { padding:12px; text-align:left; border-bottom:1px solid #f0f0f0; font-size:14px; }
  th {
    background: linear-gradient(90deg, #2c3e50, #34495e); color:#fff; font-weight:600;
    text-transform:uppercase; font-size:12px; letter-spacing:.5px;
    cursor:pointer; user-select:none; white-space:nowrap;
  }
  th:hover { background: linear-gradient(90deg, #34495e, #4b6584); }
  th .arrow { font-size:11px; margin-left:4px; opacity:.7; }
  tbody tr { transition: background .15s ease; }
  tbody tr:hover { background:#f7fafc; }

  .status-posted { color:#27ae60; font-weight:bold; }
  .status-error { color:#e74c3c; font-weight:bold; }
  .status-pending { color:#f39c12; font-weight:bold; }

  #btnPengaturan {
    position:fixed; top:16px; left:16px; width:46px; height:46px;
    border:none; border-radius:12px;
    background: linear-gradient(135deg, #2c3e50, #4b6584);
    color:#fff; font-size:18px; font-weight:bold; cursor:pointer; z-index:6;
    box-shadow:0 4px 10px rgba(0,0,0,.25);
    display:flex; align-items:center; justify-content:center;
    transition: transform .2s ease;
  }
  #btnPengaturan:hover { transform: scale(1.08); }

  /* ===== Tombol Scroll ===== */
  .btnScroll {
    position:fixed; right:16px; width:46px; height:46px; border:none;
    border-radius:50%; background:#2c3e50; color:#fff; font-size:20px;
    cursor:pointer; box-shadow:0 4px 10px rgba(0,0,0,.25); z-index:50;
    display:none; align-items:center; justify-content:center;
    opacity:.85; transition:opacity .2s ease, transform .2s ease;
  }
  .btnScroll:hover { opacity:1; transform: scale(1.08); }
  #btnScrollUp { bottom:78px; }
  #btnScrollDown { bottom:20px; }

  /* ===== Modal Login ===== */
  .modalOverlay {
    display:none; position:fixed; top:0; left:0; right:0; bottom:0;
    background:rgba(0,0,0,.55); align-items:center; justify-content:center;
    z-index:100; backdrop-filter: blur(2px);
  }
  .modalBox {
    background:#fff; padding:26px; border-radius:14px;
    width:90%; max-width:360px; max-height:90vh; overflow:auto;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
  }
  .modalBox h3 { margin-top:0; color:#2c3e50; }
  .modalBox label { font-size:13px; color:#7f8c8d; font-weight:600; }
  .modalBox input, .modalBox select {
    width:100%; padding:9px; margin:6px 0 12px;
    border:1px solid #dcdfe3; border-radius:8px; box-sizing:border-box; font-size:14px;
  }
  .modalBox input:focus, .modalBox select:focus {
    outline:none; border-color:#3498db; box-shadow:0 0 0 2px rgba(52,152,219,.2);
  }
  .modalBox button {
    width:100%; padding:10px; border:none; border-radius:8px;
    color:#fff; margin-top:4px; cursor:pointer; font-weight:600;
    transition: opacity .2s ease;
  }
  .modalBox button:hover { opacity:.88; }
  .modalBox hr { border:none; border-top:1px solid #eee; margin:16px 0; }

  /* ===== Panel Pengaturan Mengambang ===== */
  #panelPengaturan {
    display:none; position:fixed; top:80px; left:80px;
    width:340px; max-height:80vh; overflow:auto;
    background:rgba(255,255,255,.88);
    backdrop-filter: blur(6px);
    border-radius:16px;
    box-shadow:0 12px 30px rgba(0,0,0,.3);
    z-index:120;
    border:1px solid rgba(255,255,255,.5);
  }
  #panelHeader {
    background: linear-gradient(90deg, rgba(44,62,80,.92), rgba(75,101,132,.92));
    color:#fff; padding:12px 16px; border-radius:16px 16px 0 0;
    cursor:move; display:flex; justify-content:space-between; align-items:center;
    font-weight:700; font-size:15px; user-select:none;
  }
  #panelHeader span.tutupX { cursor:pointer; font-size:18px; }
  .panelBody { padding:16px; }

  .tabMenu { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .tabBtn {
    flex:1 1 auto; padding:7px 8px; font-size:12px; border:none; border-radius:8px;
    background:#ecf0f3; color:#2c3e50; cursor:pointer; font-weight:600;
    transition: background .2s ease, color .2s ease;
  }
  .tabBtn.aktif { background:#2c3e50; color:#fff; }

  .tabPanel { display:none; }
  .tabPanel.aktif { display:block; }

  .tabPanel label { font-size:12.5px; color:#555; font-weight:600; display:block; margin-top:8px; }
  .tabPanel input, .tabPanel select {
    width:100%; padding:8px; margin:4px 0 8px;
    border:1px solid #dcdfe3; border-radius:8px; font-size:13.5px; box-sizing:border-box;
    background:rgba(255,255,255,.9);
  }
  .tabPanel button {
    width:100%; padding:9px; border:none; border-radius:8px;
    color:#fff; margin-top:4px; cursor:pointer; font-weight:600; font-size:13.5px;
    transition: opacity .2s ease;
  }
  .tabPanel button:hover { opacity:.88; }

  #pesanPanel { margin-top:12px; font-size:13px; text-align:center; font-weight:600; }

  @media (max-width: 600px) {
    h1 { font-size:21px; }
    .logoHeader { width:44px; height:44px; }
    .kotak { min-width:100px; padding:14px; }
    .kotak h2 { font-size:22px; }

    table, thead, tbody, th, td, tr { display:block; }
    thead { display:none; }
    tbody tr {
      background:#fff; margin-bottom:12px; border-radius:10px;
      box-shadow:0 2px 8px rgba(0,0,0,.08); padding:12px;
    }
    tbody td {
      border:none; padding:6px 4px; font-size:13px;
      display:flex; justify-content:space-between;
    }
    tbody td::before {
      content: attr(data-label); font-weight:bold; color:#2c3e50; margin-right:8px;
    }
    #btnPengaturan { top:10px; left:10px; width:40px; height:40px; font-size:16px; }
    #panelPengaturan { left:5%; width:90%; top:60px; }
  }
</style>
</head>
<body>

<div class="headerBar">
  <img src="logo-juragan-kambing.png" alt="Logo" class="logoHeader">
  <h1>JASA AQIQAH DEPOK #2</h1>
</div>
<p id="jamRealTime">--:--:--</p>
<p id="infoUpdate">Memuat data...</p>

<div class="kartu">
  <div class="kotak"><h2 id="total">-</h2><p>Total Naskah</p></div>
  <div class="kotak"><h2 id="posted">-</h2><p>Sudah Posting</p></div>
  <div class="kotak"><h2 id="pending">-</h2><p>Belum Posting</p></div>
  <div class="kotak"><h2 id="error">-</h2><p>Error</p></div>
  <div class="kotak"><h2 id="successRate">-</h2><p>Tingkat Keberhasilan</p></div>
</div>
<div class="kotak"><h2 id="terjadwalHariIni">-</h2><p>Terjadwal Hari Ini</p></div>
<div class="kotakJadwal">
  <h2 id="jadwalBerikutnya">-</h2>
  <p>Jadwal Berikutnya</p>
  <div id="countdown">--:--:--</div>
</div>

<table>
  <thead>
    <tr>
      <th data-key="judul">Judul <span class="arrow"></span></th>
      <th data-key="lokasi">Lokasi <span class="arrow"></span></th>
      <th data-key="jadwal">Jadwal <span class="arrow"></span></th>
      <th data-key="status">Status <span class="arrow"></span></th>
      <th data-key="link">Link <span class="arrow"></span></th>
    </tr>
  </thead>
  <tbody id="tabelData"></tbody>
</table>

 <div style="text-align:center; margin:16px 0;">
  <button id="btnMore" style="display:none; padding:10px 22px; border:none; border-radius:8px; background:#2c3e50; color:#fff; font-weight:600; cursor:pointer;">Tampilkan lebih banyak</button>
</div>
 
<button id="btnPengaturan" title="Pengaturan">⚙</button>
<button id="btnScrollUp" class="btnScroll" title="Ke Atas">↑</button>
<button id="btnScrollDown" class="btnScroll" title="Ke Bawah">↓</button>

<!-- Modal Login -->
<div id="modalLogin" class="modalOverlay">
  <div class="modalBox">
    <h3>Masuk Pengaturan</h3>
    <input type="password" id="inputPassword" placeholder="Masukkan password">
    <button onclick="cekLogin()" style="background:#2c3e50;">Masuk</button>
    <p style="cursor:pointer;color:#3498db;margin-top:10px;" onclick="resetPass()">Lupa password? Kirim ke email</p>
    <p id="pesanLogin" style="color:red;"></p>
    <button onclick="tutupModalLogin()" style="background:#7f8c8d;">Batal</button>
  </div>
</div>

<!-- Panel Pengaturan Mengambang -->
<div id="panelPengaturan">
  <div id="panelHeader">
    <span>⚙ Pengaturan Aplikasi</span>
    <span class="tutupX" onclick="tutupPanel()">✕</span>
  </div>
  <div class="panelBody">

    <div class="tabMenu">
      <button class="tabBtn aktif" onclick="gantiTab(this,'tabUmum')">Umum</button>
      <button class="tabBtn" onclick="gantiTab(this,'tabPassword')">Password</button>
      <button class="tabBtn" onclick="gantiTab(this,'tabImport')">Import</button>
      <button class="tabBtn" onclick="gantiTab(this,'tabKontrol')">Kontrol</button>
      <button class="tabBtn" onclick="gantiTab(this,'tabPerintah')">Perintah</button>
    </div>

    <div id="tabUmum" class="tabPanel aktif">
      <label>ID Blog</label>
      <input type="text" id="blogId">
      <label>ID Folder Foto</label>
      <input type="text" id="folderId">
      <label>Email Reset Password</label>
      <input type="email" id="emailReset">
      <button onclick="simpanPengaturanUI()" style="background:#27ae60;">Simpan Pengaturan</button>
    </div>

    <div id="tabPassword" class="tabPanel">
      <label>Password Lama</label>
      <input type="password" id="passwordLama" placeholder="Password lama">
      <label>Password Baru</label>
      <input type="password" id="passwordBaru" placeholder="Password baru">
      <button onclick="ubahPasswordUI()" style="background:#2980b9;">Ubah Password</button>
    </div>

    <div id="tabImport" class="tabPanel">
      <label>ID File Excel (Google Drive)</label>
      <input type="text" id="fileIdExcel">
      <button onclick="importNaskahUI()" style="background:#8e44ad;">Import Naskah</button>
    </div>

    <div id="tabKontrol" class="tabPanel">
      <label>Kontrol Aplikasi</label>
      <div style="display:flex; gap:8px;">
        <button onclick="jalankanAksi('startAplikasi')" style="background:#2ecc71;">Start</button>
        <button onclick="jalankanAksi('stopAplikasi')" style="background:#e74c3c;">Stop</button>
      </div>
    </div>

    <div id="tabPerintah" class="tabPanel">
      <label>Perintah Manual</label>
      <select id="daftarPerintah">
        <option value="setupAwal">setupAwal</option>
        <option value="resetStatusError">resetStatusError</option>
        <option value="perbaikiLabelTerlaluPanjang">perbaikiLabelTerlaluPanjang</option>
        <option value="isiLinkFotoOtomatis">isiLinkFotoOtomatis</option>
        <option value="isiLokasiOtomatis">isiLokasiOtomatis</option>
        <option value="buatJadwalAcakHarian">buatJadwalAcakHarian</option>
        <option value="cekJadwalPosting">cekJadwalPosting</option>
        <option value="isiLinkPostLama">isiLinkPostLama</option>
      </select>
      <button onclick="jalankanPerintahUI()" style="background:#f39c12;">Jalankan Perintah</button>
    </div>

    <p id="pesanPanel"></p>
  </div>
</div>

<script>
var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbx5HtBXiw85i_Ge0TbsPSM1vMgvc1nOdRMMRzHqmZSJYl_Ws3e-fAQAKD6mBaAfEif4/exec';
var passwordSesi = '';
var jadwalBerikutnyaTimestamp = null;
var dataTerakhir = [];
var sortKeyAktif = null;
var sortArahAsc = true;

// ================== JAM REAL-TIME ==================
function updateJam() {
  var now = new Date();
  document.getElementById('jamRealTime').innerText = '🕒 ' + now.toLocaleTimeString('id-ID');
  updateCountdown();
}
setInterval(updateJam, 1000);
updateJam();

// ================== COUNTDOWN ==================
function updateCountdown() {
  var el = document.getElementById('countdown');
  if (!jadwalBerikutnyaTimestamp) { el.innerText = '-'; return; }
  var selisih = jadwalBerikutnyaTimestamp - new Date().getTime();
  if (selisih <= 0) { el.innerText = 'Waktunya posting!'; return; }
  var jam = Math.floor(selisih / 3600000);
  var menit = Math.floor((selisih % 3600000) / 60000);
  var detik = Math.floor((selisih % 60000) / 1000);
  el.innerText =
    (jam < 10 ? '0' : '') + jam + ':' +
    (menit < 10 ? '0' : '') + menit + ':' +
    (detik < 10 ? '0' : '') + detik;
}

// ================== MUAT DATA DASHBOARD ==================


// ================== MUAT DATA DASHBOARD ==================
var batasTampil = 50;
var rowsSaatIni = [];

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

function terapkanData(data) {
  document.getElementById('total').innerText = data.total;
  document.getElementById('posted').innerText = data.posted;
  document.getElementById('pending').innerText = data.pending;
  document.getElementById('error').innerText = data.error;
  document.getElementById('successRate').innerText = data.successRate + '%';
  document.getElementById('terjadwalHariIni').innerText = data.terjadwalHariIni != null ? data.terjadwalHariIni : 0;
  document.getElementById('jadwalBerikutnya').innerText = data.jadwalBerikutnyaTeks;
  document.getElementById('infoUpdate').innerText = 'Terakhir diperbarui: ' + data.waktuUpdate;

  jadwalBerikutnyaTimestamp = data.jadwalBerikutnyaTimestamp || null;
  updateCountdown();

  dataTerakhir = data.rows || [];
  if (sortKeyAktif) urutkanData(sortKeyAktif, false);
  else renderTabel(dataTerakhir);
}

function muatData() {
  if (document.hidden) return;   // jangan ambil data saat tab tidak dibuka
  fetch(WEB_APP_URL + '?format=json')
    .then(function (r) { return r.text(); })
    .then(function (txt) {
      try { localStorage.setItem('dashCache', txt); } catch (e) {}
      terapkanData(JSON.parse(txt));
    })
    .catch(function () {
      document.getElementById('infoUpdate').innerText = 'Gagal memuat data. Periksa URL Web App.';
    });
}

// Render sekali saja (bukan += di dalam loop), maksimal 'batasTampil' baris
function renderTabel(rows) {
  rowsSaatIni = rows;
  var tampil = rows.slice(0, batasTampil);
  var html = [];
  for (var i = 0; i < tampil.length; i++) {
    var row = tampil[i];
    var st = String(row.status || '');
    var kelas = st === 'Posted' ? 'status-posted' : (st.indexOf('Error') === 0 ? 'status-error' : 'status-pending');
    var link = row.link ? '<a href="' + esc(row.link) + '" target="_blank" rel="noopener">Lihat</a>' : '-';
    html.push(
      '<tr>' +
        '<td data-label="Judul">' + esc(row.judul) + '</td>' +
        '<td data-label="Lokasi">' + esc(row.lokasi) + '</td>' +
        '<td data-label="Jadwal">' + esc(row.jadwal) + '</td>' +
        '<td data-label="Status" class="' + kelas + '">' + esc(st) + '</td>' +
        '<td data-label="Link">' + link + '</td>' +
      '</tr>'
    );
  }
  document.getElementById('tabelData').innerHTML = html.join('');

  var btn = document.getElementById('btnMore');
  if (rows.length > batasTampil) {
    btn.style.display = 'inline-block';
    btn.innerText = 'Tampilkan lebih banyak (' + batasTampil + ' dari ' + rows.length + ')';
  } else {
    btn.style.display = 'none';
  }
}

document.getElementById('btnMore').onclick = function () {
  batasTampil += 50;
  renderTabel(rowsSaatIni);
};

// Tampilkan data tersimpan dulu (instan), lalu perbarui dari server
try {
  var tersimpan = localStorage.getItem('dashCache');
  if (tersimpan) terapkanData(JSON.parse(tersimpan));
} catch (e) {}

muatData();
setInterval(muatData, 60000);   // tiap 60 detik, bukan 15 detik
document.addEventListener('visibilitychange', function () {
  if (!document.hidden) muatData();   // segarkan saat tab dibuka kembali
});

// ================== SORTING TABEL ==================
document.querySelectorAll('th[data-key]').forEach(function (th) {
  th.addEventListener('click', function () {
    var key = th.getAttribute('data-key');
    urutkanData(key, true);
  });
});

function urutkanData(key, toggleArah) {
  if (toggleArah) {
    sortArahAsc = (sortKeyAktif === key) ? !sortArahAsc : true;
  }
  sortKeyAktif = key;

  var hasil = dataTerakhir.slice().sort(function (a, b) {
    var valA = (a[key] || '').toString().toLowerCase();
    var valB = (b[key] || '').toString().toLowerCase();
    if (valA < valB) return sortArahAsc ? -1 : 1;
    if (valA > valB) return sortArahAsc ? 1 : -1;
    return 0;
  });

  document.querySelectorAll('th[data-key] .arrow').forEach(function (span) {
    span.innerText = '';
  });
  var thAktif = document.querySelector('th[data-key="' + key + '"] .arrow');
  if (thAktif) thAktif.innerText = sortArahAsc ? '▲' : '▼';

  renderTabel(hasil);
}

// ================== TOMBOL SCROLL ==================
var btnUp = document.getElementById('btnScrollUp');
var btnDown = document.getElementById('btnScrollDown');

window.addEventListener('scroll', function () {
  if (window.scrollY > 200) {
    btnUp.style.display = 'flex';
  } else {
    btnUp.style.display = 'none';
  }
  var maxScroll = document.body.scrollHeight - window.innerHeight - 100;
  if (window.scrollY < maxScroll) {
    btnDown.style.display = 'flex';
  } else {
    btnDown.style.display = 'none';
  }
});

btnUp.onclick = function () {
  window.scrollTo({ top: 0, behavior: 'smooth' });
};
btnDown.onclick = function () {
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
};

// ================== MODAL LOGIN ==================
document.getElementById('btnPengaturan').onclick = function () {
  document.getElementById('modalLogin').style.display = 'flex';
};

function tutupModalLogin() {
  document.getElementById('modalLogin').style.display = 'none';
  document.getElementById('pesanLogin').innerText = '';
}

function cekLogin() {
  var pass = document.getElementById('inputPassword').value;
  fetch(WEB_APP_URL + '?action=login&password=' + encodeURIComponent(pass))
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (res.sukses) {
        passwordSesi = pass;
        document.getElementById('modalLogin').style.display = 'none';
        bukaPanelPengaturan();
      } else {
        document.getElementById('pesanLogin').innerText = 'Password salah.';
      }
    });
}

function resetPass() {
  fetch(WEB_APP_URL + '?action=resetPassword&password=x')
    .then(function () {
      document.getElementById('pesanLogin').style.color = 'green';
      document.getElementById('pesanLogin').innerText = 'Password baru dikirim ke email.';
    });
}

// ================== PANEL PENGATURAN ==================
function bukaPanelPengaturan() {
  fetch(WEB_APP_URL + '?action=ambilPengaturan&password=' + encodeURIComponent(passwordSesi))
    .then(function (r) { return r.json(); })
    .then(function (data) {
      document.getElementById('blogId').value = data.blogId || '';
      document.getElementById('folderId').value = data.folderId || '';
      document.getElementById('emailReset').value = data.emailReset || '';
      document.getElementById('panelPengaturan').style.display = 'block';
    });
}

function tutupPanel() {
  document.getElementById('panelPengaturan').style.display = 'none';
}

function gantiTab(tombol, idTab) {
  document.querySelectorAll('.tabBtn').forEach(function (b) { b.classList.remove('aktif'); });
  document.querySelectorAll('.tabPanel').forEach(function (p) { p.classList.remove('aktif'); });
  tombol.classList.add('aktif');
  document.getElementById(idTab).classList.add('aktif');
}

function simpanPengaturanUI() {
  var blogId = document.getElementById('blogId').value;
  var folderId = document.getElementById('folderId').value;
  var email = document.getElementById('emailReset').value;
  fetch(WEB_APP_URL + '?action=simpanPengaturan&password=' + encodeURIComponent(passwordSesi) +
    '&blogId=' + encodeURIComponent(blogId) + '&folderId=' + encodeURIComponent(folderId) + '&email=' + encodeURIComponent(email))
    .then(function (r) { return r.json(); })
    .then(function (res) { tampilkanPesanPanel(res.pesan); });
}

function ubahPasswordUI() {
  var lama = document.getElementById('passwordLama').value;
  var baru = document.getElementById('passwordBaru').value;
  fetch(WEB_APP_URL + '?action=ubahPassword&password=' + encodeURIComponent(passwordSesi) +
    '&passwordLama=' + encodeURIComponent(lama) + '&passwordBaru=' + encodeURIComponent(baru))
    .then(function (r) { return r.json(); })
    .then(function (res) {
      tampilkanPesanPanel(res.pesan);
      if (res.sukses) passwordSesi = baru;
    });
}

function jalankanPerintahUI() {
  var fungsi = document.getElementById('daftarPerintah').value;

function tampilkanPesanPanel(pesan) {
  document.getElementById('pesanPanel').innerText = pesan || 'Selesai.';
}

// ================== PANEL BISA DIGESER (DRAGGABLE) ==================
(function () {
  var panel = document.getElementById('panelPengaturan');
  var header = document.getElementById('panelHeader');
  var offsetX = 0, offsetY = 0, ditekan = false;

  header.addEventListener('mousedown', function (e) {
    ditekan = true;
    offsetX = e.clientX - panel.offsetLeft;
    offsetY = e.clientY - panel.offsetTop;
  });

  document.addEventListener('mousemove', function (e) {
    if (!ditekan) return;
    panel.style.left = (e.clientX - offsetX) + 'px';
    panel.style.top = (e.clientY - offsetY) + 'px';
  });

  document.addEventListener('mouseup', function () {
    ditekan = false;
  });

  // dukungan sentuh (mobile)
  header.addEventListener('touchstart', function (e) {
    ditekan = true;
    var t = e.touches[0];
    offsetX = t.clientX - panel.offsetLeft;
    offsetY = t.clientY - panel.offsetTop;
  });
  document.addEventListener('touchmove', function (e) {
    if (!ditekan) return;
    var t = e.touches[0];
    panel.style.left = (t.clientX - offsetX) + 'px';
    panel.style.top = (t.clientY - offsetY) + 'px';
  });
  document.addEventListener('touchend', function () {
    ditekan = false;
  });
})();
</script>
